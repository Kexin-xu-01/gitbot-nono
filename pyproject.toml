[project]
name = "gitbot"
version = "1.0.0"
description = "GitHub issue triage bot powered by Gemini"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "google-genai>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]
